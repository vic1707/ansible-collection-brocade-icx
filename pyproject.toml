[project]
name = "ansible-collection-icx"
requires-python = "==3.14.5"
version = "0.0.1"
dependencies = [
	"ansible==13.7.0",
	"ansible-lint==26.4.0",
	"coverage==7.14.1",
	"pydantic==2.13.4",
	"pytest==9.0.3",
	"pytest-xdist==3.8.0",
	"ruff==0.15.15",
	"ty==0.0.40",
]

[tool.ruff]
indent-width = 4
line-length = 180

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = [
	"E",
	"F",
	"UP",
	"B",
	"SIM",
	"I",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 180
