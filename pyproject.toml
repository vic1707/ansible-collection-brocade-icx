[project]
name = "ansible-collection-icx"
requires-python = "==3.14.7"
version = "0.0.1"
dependencies = [
	"ansible==14.3.1",
	"ansible-lint==26.8.0",
	"coverage==7.16.0",
	# paramiko 5.0.0 (2026-05-09) dropped both:
	#   - SHA-1 DH KEX (diffie-hellman-group1-sha1, needed by ICX)
	#   - ssh-rsa host key algorithm (also needed by ICX)
	# https://www.paramiko.org/changelog.html
	# commit a448945 (Remove SHA1 support from RSA key handling)
	"paramiko==5.0.0",
	"pyserial==3.5",
	"pydantic==2.13.5",
	"pytest==9.1.1",
	"pytest-xdist==3.8.0",
	"ruff==0.16.5",
	"ty==0.0.76",
]

[tool.ruff]
indent-width = 4
line-length = 180

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = [
	"E",
	"F",
	"UP",
	"B",
	"SIM",
	"I",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 180
