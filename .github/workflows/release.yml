name: Publish collection

on:
  push:
    tags: ["*"]

permissions:
  contents: read

concurrency:
  group: galaxy-publish
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 requires this syntax
  hygiene:
    uses: ./.github/workflows/hygiene.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 requires this syntax
  publish:
    needs: [tests, hygiene]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: false
      - name: Build collection
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mise exec -- python -c 'import os, yaml; assert str(yaml.safe_load(open("ansible_collections/vic1707/icx/galaxy.yml"))["version"]) == os.environ["RELEASE_TAG"].removeprefix("v"), "Tag must match galaxy.yml version"'
          mise exec -- ansible-galaxy collection build ansible_collections/vic1707/icx --output-path "$RUNNER_TEMP"
      - name: Publish to Ansible Galaxy
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          test -n "$GALAXY_API_KEY"
          mise exec -- ansible-galaxy collection publish "$RUNNER_TEMP"/vic1707-icx-*.tar.gz --token "$GALAXY_API_KEY"
