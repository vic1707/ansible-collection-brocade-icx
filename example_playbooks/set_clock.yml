---
- name: Set Brocade ICX switch clock to current time
  hosts: "{{ target_hosts | default('sw_uart') }}"
  gather_facts: false

  tasks:
    - name: Set clock
      bofzilla.icx.clock:
        # time: # omited so <now>
        # timezone: # omited so host's current
        summer_time: false
        save: "true"
        enable_password: "dummy"
      register: result

    - name: Show what was set
      ansible.builtin.debug:
        var: result
