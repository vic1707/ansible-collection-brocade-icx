---
- name: Set Brocade ICX switch clock to current time
  hosts: "{{ target_hosts | default('sw_uart') }}"
  gather_facts: false

  tasks:
    - name: Set clock
      bofzilla.icx.clock:
        # time: # omitted so <now>
        # timezone: # omitted so host's current timezone
        summer_time: false
        save_when: changed
        enable_password: "{{ icx_enable_password | default(omit) }}"
      register: result

    - name: Show what was set
      ansible.builtin.debug:
        var: result
