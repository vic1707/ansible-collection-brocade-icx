---
all:
  children:
    icx:
      hosts:
        sw_ssh:
          ansible_host: 192.168.1.105
          ansible_user: admin
          ansible_password: dummy
          ansible_connection: ansible.netcommon.network_cli
          ansible_network_os: bofzilla.icx.icx
          ansible_network_cli_ssh_type: paramiko
          ansible_paramiko_host_key_checking: false
          ansible_ssh_common_args: >-
            -o KexAlgorithms=+diffie-hellman-group1-sha1
            -o HostKeyAlgorithms=+ssh-rsa
          ansible_command_timeout: 60
          ansible_connect_timeout: 30
          icx_enable_password: ""

        sw_uart:
          ansible_host: sw_uart
          ansible_user: admin
          ansible_password: dummy
          ansible_connection: bofzilla.icx.serial
          ansible_network_os: bofzilla.icx.icx
          ansible_serial_port: /dev/cu.usbserial-A9A2C0QQ
          ansible_serial_baud: 9600
          ansible_command_timeout: 60
          ansible_connect_timeout: 30
          icx_enable_password: ""
